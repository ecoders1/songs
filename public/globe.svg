  <!-- AFAAN OROMOO text (green) -->
  <text x="540" y="390" font-family="Arial Black, Arial, sans-serif" font-size="96" font-weight="900" fill="#2e7d32" text-anchor="middle" letter-spacing="6">AFAAN OROMOO</text>
