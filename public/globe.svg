<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540">
  <!-- White background -->
  <rect width="1080" height="540" fill="white"/>

  <!-- APOSTOLIC text (dark blue) -->
  <text x="540" y="165" font-family="Arial Black, Arial, sans-serif" font-size="148" font-weight="900" fill="#1a237e" text-anchor="middle" letter-spacing="4">APOSTOLIC</text>

  <!-- Music note left -->
  <text x="68" y="268" font-family="Arial, sans-serif" font-size="80" fill="#1a237e">♩</text>
