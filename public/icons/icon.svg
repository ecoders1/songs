  <!-- AFAAN OROMOO text (green) -->
  <text x="256" y="340" font-family="Arial Black, Arial, sans-serif" font-size="64" font-weight="900" fill="#2e7d32" text-anchor="middle" letter-spacing="3">AFAAN OROMOO</text>
