  <!-- AFAAN OROMOO text (green) -->
  <text x="256" y="322" font-family="Arial Black, Arial, sans-serif" font-size="46" font-weight="900" fill="#2e7d32" text-anchor="middle" letter-spacing="2">AFAAN OROMOO</text>
