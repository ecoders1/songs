<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- White background -->
  <rect width="512" height="512" fill="white"/>

  <!-- APOSTOLIC text (dark blue) -->
  <text x="256" y="155" font-family="Arial Black, Arial, sans-serif" font-size="62" font-weight="900" fill="#1a237e" text-anchor="middle" letter-spacing="2">APOSTOLIC</text>

  <!-- Music note left -->
  <text x="68" y="238" font-family="Arial, sans-serif" font-size="38" fill="#1a237e">♩</text>
