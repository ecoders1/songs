<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- White background -->
  <rect width="512" height="512" fill="white"/>

  <!-- APOSTOLIC text (dark blue) -->
  <text x="256" y="148" font-family="Arial Black, Arial, sans-serif" font-size="88" font-weight="900" fill="#1a237e" text-anchor="middle" letter-spacing="2">APOSTOLIC</text>

  <!-- Music note left -->
  <text x="62" y="242" font-family="Arial, sans-serif" font-size="52" fill="#1a237e">♩</text>
