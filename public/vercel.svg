<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- White background -->
  <rect width="800" height="500" fill="white"/>

  <!-- APOSTOLIC (dark blue) -->
  <text x="400" y="160" font-family="Arial Black, Arial, sans-serif" font-size="90" font-weight="900" fill="#1a237e" text-anchor="middle" letter-spacing="3">APOSTOLIC</text>

  <!-- Music note left -->
  <text x="72" y="258" font-family="Arial, sans-serif" font-size="44" fill="#1a237e">♩</text>
  <!-- Treble clef right -->
  <text x="690" y="264" font-family="Arial, sans-serif" font-size="48" fill="#1a237e">𝄞</text>

  <!-- SONGS (red) -->
  <text x="400" y="268" font-family="Arial Black, Arial, sans-serif" font-size="106" font-weight="900" fill="#c62828" text-anchor="middle" letter-spacing="5">SONGS</text>

  <!-- Divider line -->
  <line x1="90" y1="298" x2="710" y2="298" stroke="#1a237e" stroke-width="3"/>

  <!-- AFAAN OROMOO (green) -->
  <text x="400" y="356" font-family="Arial Black, Arial, sans-serif" font-size="68" font-weight="900" fill="#2e7d32" text-anchor="middle" letter-spacing="4">AFAAN OROMOO</text>
</svg>
