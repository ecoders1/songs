<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1db800"/>
      <stop offset="55%" stop-color="#22a800"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4cff00"/>
      <stop offset="100%" stop-color="#2979ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
    <filter id="wshadow">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="rgba(0,60,180,0.5)"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Circle ring -->
  <circle cx="400" cy="210" r="172" fill="none" stroke="url(#ring)" stroke-width="8" opacity="0.9"/>
  <path d="M220,100 Q175,210 225,320" fill="none" stroke="#6eff30" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M568,88 Q625,210 565,322" fill="none" stroke="#448aff" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <!-- A -->
  <text x="255" y="300"
    font-family="Arial Black,Arial,sans-serif"
    font-size="210" font-weight="900"
    fill="white" filter="url(#wshadow)" letter-spacing="-6">A</text>

  <!-- S -->
  <text x="420" y="300"
    font-family="Arial Black,Arial,sans-serif"
    font-size="210" font-weight="900"
    fill="url(#gold)" filter="url(#shadow)" letter-spacing="-6">S</text>

  <!-- Afaan -->
  <text x="202" y="390"
    font-family="Arial Black,Arial,sans-serif"
    font-size="52" font-weight="900"
    fill="white" filter="url(#wshadow)">Afaan</text>

  <!-- Oromo -->
  <text x="388" y="390"
    font-family="Arial Black,Arial,sans-serif"
    font-size="52" font-weight="900"
    fill="#FFD600" filter="url(#shadow)">Oromo</text>

  <line x1="202" y1="400" x2="598" y2="400" stroke="url(#ring)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
</svg>
